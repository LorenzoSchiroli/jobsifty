[project]
name = "ingestion"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "ddgs>=9.14.1",
    "ftfy>=6.3.1",
    "groq>=1.2.0",
    "playwright>=1.58.0",
    "pydantic>=2.13.2",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.2",
    "python-jobspy>=1.1.82",
    "requests>=2.33.1",
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
    "tabulate>=0.10.0",
    "trafilatura>=2.0.0",
    "tqdm>=4.67.3",
    "lingua-language-detector>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
