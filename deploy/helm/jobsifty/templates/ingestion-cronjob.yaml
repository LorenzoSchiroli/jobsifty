{{- $interval := int .Values.ingestion.intervalHours }}
{{- if or (lt $interval 1) (gt $interval 12) (ne (mod 24 $interval) 0) }}
{{- fail (printf "ingestion.intervalHours must divide 24 (1, 2, 3, 4, 6, 8 or 12), got %v" .Values.ingestion.intervalHours) }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion
spec:
  schedule: {{ printf "0 */%d * * *" $interval | quote }}
  concurrencyPolicy: Forbid
  suspend: {{ .Values.ingestion.suspend }}
  jobTemplate:
    spec:
      backoffLimit: 1
      # killed 10 minutes before the next run; a healthy run stops itself before that
      activeDeadlineSeconds: {{ sub (mul $interval 3600) 600 }}
      template:
        spec:
          {{- $nodeContext := dict "root" . "pool" .Values.scheduling.ingestion }}
          {{- with include "jobsifty.nodeAffinity" $nodeContext }}
          affinity:
            {{- . | nindent 12 }}
          {{- end }}
          restartPolicy: OnFailure
          containers:
          - name: ingestion
            image: {{ .Values.ingestion.image.repository }}:{{ .Values.ingestion.image.tag }}
            imagePullPolicy: {{ .Values.imagePullPolicy }}
            command: ["uv", "run", "python", "-m", "ingestion.pipeline", {{ .Values.ingestion.scope | quote }}, "--interval-hours", {{ $interval | quote }}]
            envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
            resources:
              {{- toYaml .Values.ingestion.resources | nindent 14 }}
