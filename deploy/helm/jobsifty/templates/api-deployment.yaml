apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # replicas intentionally omitted: the HPA owns the replica count.
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: {{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command: ["uv", "run", "uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
        envFrom:
        - secretRef:
            name: {{ .Values.existingSecret }}
        env:
        - name: TORCH_NUM_THREADS
          value: {{ .Values.api.torchThreads | quote }}
        - name: OMP_NUM_THREADS
          value: {{ .Values.api.torchThreads | quote }}
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        resources:
          {{- toYaml .Values.api.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
  - port: 8000
    targetPort: 8000
