[project]
name = "llmpool"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llmpool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
